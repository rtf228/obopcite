<!DOCTYPE html>

  <!-- React 18 & Babel for standalone run -->

<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- ДАНІ КАТАЛОГУ (ДЕКОР) ---
    const CLOTHES = [
      {
        id: 1,
        name: 'Худі "CyberVoid" Black',
        category: 'hoodies',
        price: '1 890 ₴',
        image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80',
        badge: 'Хіт',
      },
      {
        id: 2,
        name: 'Бомбер "NeoNova" Violet',
        category: 'outerwear',
        price: '3 450 ₴',
        image: 'https://images.unsplash.com/photo-1548883354-7622d03aca27?auto=format&fit=crop&w=600&q=80',
        badge: 'Новинка',
      },
      {
        id: 3,
        name: 'Сукня "Amethyst Silk"',
        category: 'dresses',
        price: '4 200 ₴',
        image: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=600&q=80',
      },
      {
        id: 4,
        name: 'Джинси "TechDenim 01"',
        category: 'pants',
        price: '2 650 ₴',
        image: 'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=600&q=80',
      }
    ];

    // --- ГОЛОВНИЙ ДОДАТОК ---
    function App() {
      // Стан мобільного меню
      const [menuOpen, setMenuOpen] = useState(false);

      // Стан декоративної примірочної
      const [userPhoto, setUserPhoto] = useState(null);
      const [consent, setConsent] = useState(true);
      const [selectedCloth, setSelectedCloth] = useState(CLOTHES[0]);
      const [selectedSize, setSelectedSize] = useState('M');
      const [activeCategory, setActiveCategory] = useState('all');
      const [showDemoModal, setShowDemoModal] = useState(false);

      // Стан FAQ акордеона
      const [faqOpen, setFaqOpen] = useState(0);

      // Стан контактної форми
      const [formSent, setFormSent] = useState(false);
      const [formName, setFormName] = useState('');
      const [formEmail, setFormEmail] = useState('');
      const [formMessage, setFormMessage] = useState('');

      // Обробка вибору фото (декоративне прев'ю)
      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setUserPhoto(event.target.result);
          reader.readAsDataURL(file);
        }
      };

      // Фільтрація каталогу
      const displayedClothes = activeCategory === 'all' 
        ? CLOTHES 
        : CLOTHES.filter(c => c.category === activeCategory);

      // Відправлення форми
      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!formName.trim() || !formEmail.trim()) {
          alert('Будь ласка, заповніть ім\'я та email');
          return;
        }
        setFormSent(true);
      };

      return (
        <div>
          {/* НАВІГАЦІЯ (HEADER) */}
          <header className="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              {/* Логотип */}
              <a href="#hero" className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-xl bg-violet-600 flex items-center justify-center font-black text-white text-lg shadow-md shadow-violet-600/30">
                  F
                </div>
                <span className="font-bold text-xl tracking-tight text-white">
                  Fit<span className="text-violet-500">Era</span>
                </span>
              </a>

              {/* Меню для ПК */}
              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-300">
                <a href="#hero" className="hover:text-violet-400 transition-colors">Головна</a>
                <a href="#fitting" className="hover:text-violet-400 transition-colors">Примірочна</a>
                <a href="#how" className="hover:text-violet-400 transition-colors">Як це працює</a>
                <a href="#advantages" className="hover:text-violet-400 transition-colors">Переваги</a>
                <a href="#business" className="hover:text-violet-400 transition-colors">Для бізнесу</a>
                <a href="#pricing" className="hover:text-violet-400 transition-colors">Тарифи</a>
                <a href="#faq" className="hover:text-violet-400 transition-colors">FAQ</a>
                <a href="#contact" className="hover:text-violet-400 transition-colors">Контакти</a>
              </nav>

              {/* Кнопка дії */}
              <div className="hidden sm:block">
                <a
                  href="#fitting"
                  className="px-4 py-2 rounded-xl text-xs font-semibold bg-violet-600 hover:bg-violet-500 text-white shadow-md shadow-violet-600/30 transition-all"
                >
                  Спробувати примірку
                </a>
              </div>

              {/* Гамбургер меню */}
              <button 
                onClick={() => setMenuOpen(!menuOpen)}
                className="md:hidden p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300"
              >
                {menuOpen ? '✕' : '☰'}
              </button>
            </div>

            {/* Мобільне меню */}
            {menuOpen && (
              <div className="md:hidden bg-zinc-950 border-b border-zinc-800 px-6 py-4 space-y-3">
                <a href="#hero" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Головна</a>
                <a href="#fitting" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Примірочна</a>
                <a href="#how" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Як це працює</a>
                <a href="#advantages" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Переваги</a>
                <a href="#business" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Для бізнесу</a>
                <a href="#pricing" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Тарифи</a>
                <a href="#faq" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">FAQ</a>
                <a href="#contact" onClick={() => setMenuOpen(false)} className="block text-sm text-zinc-300 hover:text-white">Контакти</a>
              </div>
            )}
          </header>

          {/* 1. ГОЛОВНА (HERO) */}
          <section id="hero" className="py-20 md:py-28 relative overflow-hidden text-center">
            {/* Підсвітка */}
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-violet-600/15 rounded-full blur-[120px] pointer-events-none" />

            <div className="max-w-4xl mx-auto px-4 relative">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-950/60 border border-violet-800/50 text-xs font-semibold text-violet-300 mb-6">
                <span>✦</span>
                <span>Штучний інтелект для моди та e-commerce</span>
              </div>

              <h1 className="text-4xl sm:text-6xl font-black tracking-tight text-white leading-tight">
                Приміряй <br />
                <span className="bg-gradient-to-r from-violet-400 via-fuchsia-300 to-indigo-300 bg-clip-text text-transparent">
                  майбутнє онлайн
                </span>
              </h1>

              <p className="mt-5 text-base sm:text-lg text-zinc-300 max-w-2xl mx-auto leading-relaxed">
                <strong>FitEra</strong> — розумна віртуальна примірочна нового покоління. 
                Оцініть реальну посадку будь-якого одягу на вашій фігурі за секунди без черг та примірочних кабінок.
              </p>

              <div className="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">
                <a
                  href="#fitting"
                  className="w-full sm:w-auto px-7 py-3.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold text-sm shadow-xl shadow-violet-600/30 transition-all"
                >
                  Спробувати примірку
                </a>
                <a
                  href="#business"
                  className="w-full sm:w-auto px-7 py-3.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 font-medium text-sm transition-all"
                >
                  Для магазинів
                </a>
              </div>

              {/* 3 показники */}
              <div className="mt-14 pt-8 border-t border-zinc-900 grid grid-cols-3 max-w-md mx-auto gap-4 text-center">
                <div>
                  <div className="text-2xl font-bold text-white">3 сек</div>
                  <div className="text-xs text-zinc-400 mt-1">Швидкість ШІ</div>
                </div>
                <div>
                  <div className="text-2xl font-bold text-white">98%</div>
                  <div className="text-xs text-zinc-400 mt-1">Точність розміру</div>
                </div>
                <div>
                  <div className="text-2xl font-bold text-violet-400">-38%</div>
                  <div className="text-xs text-zinc-400 mt-1">Повернень речей</div>
                </div>
              </div>
            </div>
          </section>

          {/* 2. ВІРТУАЛЬНА ПРИМІРОЧНА (ДЕКОРАТИВНИЙ МАКЕТ) */}

            <div className="max-w-6xl mx-auto px-4 sm:px-6">
              
              <div className="text-center max-w-2xl mx-auto mb-10">
                <span className="text-xs font-bold text-violet-400 uppercase tracking-wider bg-violet-950/60 px-3 py-1 rounded-full border border-violet-800/40">
                  Демонстраційний макет
                </span>
                <h2 className="text-3xl font-extrabold text-white mt-3">
                  Віртуальна примірочна FitEra
                </h2>
                <p className="mt-2 text-sm text-zinc-400">
                  Концепт інтерфейсу: зона завантаження фотографії та декоративний каталог моделей.
                </p>

                {/* Чесне повідомлення про демо */}
                <div className="mt-4 p-3 bg-zinc-900 border border-zinc-800 rounded-xl text-xs text-zinc-400">
                  <span className="text-violet-400 font-semibold">Демонстраційний режим ШІ-примірки (FitEra Demo):</span> Цей модуль є візуальним макетом інтерфейсу. Реальний нейромережевий рушій підключається інтернет-магазинам через API.
                </div>
              </div>

              {/* Макет інтерфейсу */}
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl p-5 sm:p-8 shadow-2xl">
                <div className="grid lg:grid-cols-12 gap-8 items-start">
                  
                  {/* Зліва: Місце для фото (декор) */}
                  <div className="lg:col-span-5 space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-violet-400 uppercase tracking-wider">
                        1. Місце для завантаження фото
                      </span>
                      {userPhoto && (
                        <button
                          onClick={() => setUserPhoto(null)}
                          className="text-xs text-rose-400 hover:underline"
                        >
                          Видалити фото
                        </button>
                      )}
                    </div>

                    {/* Візуальне вікно для фото */}
                    <label className="relative aspect-[3/4] rounded-2xl border-2 border-dashed border-zinc-800 hover:border-violet-500/50 bg-zinc-900/40 flex flex-col items-center justify-center p-6 text-center cursor-pointer transition-colors block overflow-hidden group">
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handlePhotoUpload}
                        className="hidden"
                      />

                      {userPhoto ? (
                        <div className="relative w-full h-full">
                          <img
                            src={userPhoto}
                            alt="Прев'ю фото"
                            className="w-full h-full object-cover rounded-xl"
                          />
                          <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-xl">
                            <span className="text-xs bg-violet-600 text-white px-3 py-1.5 rounded-lg font-semibold shadow">
                              Змінити фото
                            </span>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          <div className="w-14 h-14 rounded-2xl bg-violet-600/10 border border-violet-500/20 text-violet-400 flex items-center justify-center mx-auto text-2xl">
                            📷
                          </div>
                          <div>
                            <span className="text-sm font-semibold text-white block">
                              Перетягніть фото сюди
                            </span>
                            <span className="text-xs text-zinc-500 mt-1 block">
                              або натисніть для вибору файлу (JPG, PNG)
                            </span>
                          </div>
                          <span className="inline-block text-[10px] text-zinc-400 bg-zinc-800 px-2 py-0.5 rounded">
                            Рекомендовано: у повний зріст
                          </span>
                        </div>
                      )}
                    </label>

                    {/* Згода на обробку даних */}
                    <div className="pt-1">
                      <label className="flex items-start gap-2 cursor-pointer select-none">
                        <input
                          type="checkbox"
                          checked={consent}
                          onChange={(e) => setConsent(e.target.checked)}
                          className="mt-0.5 w-4 h-4 rounded border-zinc-700 bg-zinc-800 text-violet-600"
                        />
                        <span className="text-xs text-zinc-400 leading-tight">
                          Я погоджуюсь на обробку персональних даних. Фотографії не зберігаються на публічних серверах.
                        </span>
                      </label>
                    </div>
                  </div>

                  {/* Справа: Каталог для декору */}
                  <div className="lg:col-span-7 space-y-5">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-violet-400 uppercase tracking-wider">
                        2. Каталог одягу (Декор)
                      </span>

                      {/* Категорії */}
                      <div className="flex gap-1">
                        {[
                          { id: 'all', label: 'Всі' },
                          { id: 'hoodies', label: 'Худі' },
                          { id: 'outerwear', label: 'Бомбери' },
                          { id: 'dresses', label: 'Сукні' },
                        ].map(cat => (
                          <button
                            key={cat.id}
                            onClick={() => setActiveCategory(cat.id)}
                            className={`text-xs px-2.5 py-1 rounded-lg transition-all ${
                              activeCategory === cat.id
                                ? 'bg-violet-600 text-white'
                                : 'bg-zinc-900 text-zinc-400 hover:text-white'
                            }`}
                          >
                            {cat.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Сітка одягу */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      {displayedClothes.map(cloth => (
                        <div
                          key={cloth.id}
                          onClick={() => setSelectedCloth(cloth)}
                          className={`cursor-pointer rounded-xl p-2 border transition-all ${
                            selectedCloth.id === cloth.id
                              ? 'bg-violet-950/40 border-violet-500 shadow-md ring-1 ring-violet-500'
                              : 'bg-zinc-900/60 border-zinc-800 hover:border-zinc-700'
                          }`}
                        >
                          <div className="aspect-square rounded-lg overflow-hidden bg-zinc-800 mb-2 relative">
                            <img
                              src={cloth.image}
                              alt={cloth.name}
                              className="w-full h-full object-cover"
                            />
                            {cloth.badge && (
                              <span className="absolute top-1 left-1 bg-violet-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                                {cloth.badge}
                              </span>
                            )}
                          </div>
                          <div className="text-xs font-medium text-white truncate">{cloth.name}</div>
                          <div className="text-xs font-bold text-violet-400 mt-0.5">{cloth.price}</div>
                        </div>
                      ))}
                    </div>

                    {/* Панель обраного товару та розмір */}
                    <div className="p-4 bg-zinc-900 rounded-2xl border border-zinc-800 space-y-3">
                      <div className="flex justify-between items-center">
                        <div>
                          <div className="text-xs text-zinc-400">Обрана річ:</div>
                          <div className="text-sm font-bold text-white">{selectedCloth.name}</div>
                        </div>
                        <div className="text-base font-bold text-violet-400">{selectedCloth.price}</div>
                      </div>

                      {/* Розміри XS–XL */}
                      <div className="flex items-center justify-between pt-2 border-t border-zinc-800 text-xs">
                        <span className="text-zinc-400 font-medium">Оберіть розмір:</span>
                        <div className="flex gap-1">
                          {['XS', 'S', 'M', 'L', 'XL'].map(size => (
                            <button
                              key={size}
                              onClick={() => setSelectedSize(size)}
                              className={`w-7 h-7 rounded-lg text-xs font-bold transition-all ${
                                selectedSize === size
                                  ? 'bg-violet-600 text-white shadow'
                                  : 'bg-zinc-800 text-zinc-400 hover:text-white'
                              }`}
                            >
                              {size}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Кнопка "Приміряти образ" */}
                      <div className="pt-2">
                        <button
                          type="button"
                          onClick={() => setShowDemoModal(true)}
                          className="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold text-xs sm:text-sm shadow-lg shadow-violet-600/30 transition-all flex items-center justify-center gap-2"
                        >
                          <span>✨ Приміряти образ</span>
                        </button>
                        <span className="block text-[11px] text-zinc-500 text-center mt-2">
                          * Кнопка для демонстрації макета інтерфейсу FitEra
                        </span>
                      </div>
                    </div>

                  </div>

                </div>
              </div>

            </div>
          </section>

          {/* 3. ЯК ЦЕ ПРАЦЮЄ */}
          <section id="how" className="py-20 max-w-6xl mx-auto px-4 sm:px-6 text-center">
            <span className="text-xs font-bold text-violet-400 uppercase tracking-wider bg-violet-950/60 px-3 py-1 rounded-full border border-violet-800/40">

            </span>
            <h2 className="text-3xl font-extrabold text-white mt-3">
              Як це працює

            <div className="mt-12 grid md:grid-cols-3 gap-6 text-left">
              <div className="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6">
                <div className="text-3xl font-black text-violet-500/50 mb-3 font-mono">01</div>
                <h3 className="text-lg font-bold text-white mb-2">Завантаж фото</h3>
                <p className="text-sm text-zinc-400 leading-relaxed">
                  Зробіть фото у повний зріст зі смартфона. ШІ визначає пропорції тіла та ключові точки фігури.
                </p>
              </div>

              <div className="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6">
                <div className="text-3xl font-black text-violet-500/50 mb-3 font-mono">02</div>
                <h3 className="text-lg font-bold text-white mb-2">Обери одяг</h3>
